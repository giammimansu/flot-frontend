name: Deploy to CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # Vite inlines these at BUILD time — must be present here, not at runtime.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_CDN_URL: ${{ secrets.VITE_CDN_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_AERODATABOX_API_KEY: ${{ secrets.VITE_AERODATABOX_API_KEY }}
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-1

      - name: Sync to S3
        run: |
          # Upload hashed assets with long cache (1 year)
          aws s3 sync dist/ s3://flot-frontend-dev \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "manifest.json" \
            --exclude "offline.html"

          # Upload non-hashed files with no-cache
          aws s3 cp dist/index.html s3://flot-frontend-dev/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          aws s3 cp dist/sw.js s3://flot-frontend-dev/sw.js \
            --cache-control "no-cache, no-store, must-revalidate" || true

          aws s3 cp dist/manifest.json s3://flot-frontend-dev/manifest.json \
            --cache-control "no-cache, no-store, must-revalidate" || true

          aws s3 cp dist/offline.html s3://flot-frontend-dev/offline.html \
            --cache-control "no-cache, no-store, must-revalidate" || true

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3EHAQ9KGQ3710 \
            --paths "/index.html" "/sw.js" "/manifest.json" "/offline.html"
