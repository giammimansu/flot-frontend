<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flot — Mobile App UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@latest/font/lucide.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    background: #1A1D23;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
    font-family: var(--font-body);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Ensure lucide icon font elements render properly */
  [class^="icon-"], [class*=" icon-"] {
    display: inline-block;
    font-style: normal;
    line-height: 1;
    vertical-align: middle;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
function FlotApp() {
  const [screen, setScreen] = React.useState('home');
  const [matchFound, setMatchFound] = React.useState(false);

  const handleNavigate = (tab) => {
    if (tab === 'home') setScreen('home');
    else if (tab === 'trips') setScreen('home');
    else if (tab === 'chat') setScreen('chat');
    else if (tab === 'profile') setScreen('profile');
  };

  const renderScreen = () => {
    switch (screen) {
      case 'home':
        return (
          <HomeScreen
            onNavigate={handleNavigate}
            onCreateTrip={() => setScreen('newtrip')}
            onTripClick={(status) => {
              if (status === 'matched') setScreen('matchdetail');
              else { setMatchFound(false); setScreen('matching'); }
            }}
          />
        );
      case 'newtrip':
        return (
          <NewTripScreen
            onBack={() => setScreen('home')}
            onSubmit={() => { setMatchFound(false); setScreen('matching'); }}
          />
        );
      case 'matching':
        return (
          <MatchingScreen
            onBack={() => setScreen('home')}
            matchFound={matchFound}
            onMatchFound={() => {
              setMatchFound(true);
              setTimeout(() => setScreen('matchdetail'), 1500);
            }}
          />
        );
      case 'matchdetail':
        return (
          <MatchDetailScreen
            onBack={() => setScreen('home')}
            onChat={() => setScreen('chat')}
            onNavigate={handleNavigate}
          />
        );
      case 'chat':
        return <ChatScreen onBack={() => setScreen('home')} />;
      case 'profile':
        return <ProfileScreen onNavigate={handleNavigate} />;
      default:
        return <HomeScreen onNavigate={handleNavigate} onCreateTrip={() => setScreen('newtrip')} />;
    }
  };

  return (
    <IOSDevice dark={['home'].includes(screen)} title={undefined}>
      {renderScreen()}
    </IOSDevice>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FlotApp />);
</script>
</body>
</html>
