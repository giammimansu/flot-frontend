<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: #fff; padding: 20px 28px; display: flex; gap: 32px; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group-title { font-family: var(--font-mono); font-size: 10px; color: var(--neutral-400); text-transform: uppercase; letter-spacing: 0.05em; }
  .item { display: flex; align-items: center; gap: 10px; }
  .label-text { font-size: 11px; font-family: var(--font-mono); color: var(--neutral-400); min-width: 80px; }
  .llg { font-size: 16px; font-weight: 600; color: var(--neutral-900); }
  .lmd { font-size: 14px; font-weight: 600; color: var(--neutral-900); }
  .lsm { font-size: 12px; font-weight: 600; color: var(--neutral-900); }
  .mmd { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--neutral-800); }
</style>
</head>
<body>
  <div class="group">
    <div class="group-title">Labels</div>
    <div class="item">
      <span class="label-text">label-lg 16</span>
      <span class="llg">Split this ride</span>
    </div>
    <div class="item">
      <span class="label-text">label-md 14</span>
      <span class="lmd">Destination</span>
    </div>
    <div class="item">
      <span class="label-text">label-sm 12</span>
      <span class="lsm">PRO MEMBER</span>
    </div>
  </div>
  <div class="group">
    <div class="group-title">Monospace</div>
    <div class="item">
      <span class="label-text">mono-md 14</span>
      <span class="mmd">€60.00</span>
    </div>
    <div class="item">
      <span class="label-text">mono-md 14</span>
      <span class="mmd">14:35 CET</span>
    </div>
    <div class="item">
      <span class="label-text">mono-md 14</span>
      <span class="mmd">FLT-MXP-2847</span>
    </div>
  </div>
</body>
</html>
