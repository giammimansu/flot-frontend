<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: #fff; padding: 20px 24px; }
  .row { display: flex; gap: 6px; }
  .swatch { flex: 1; border-radius: 8px; display: flex; align-items: flex-end; padding: 6px 8px; }
  .swatch span { font-size: 10px; font-weight: 600; font-family: var(--font-mono); }
  .light span { color: var(--neutral-800); }
  .dark span { color: #fff; }
  .main { min-height: 64px; border-radius: 10px; }
  .sm { min-height: 36px; }
</style>
</head>
<body>
  <div class="row" style="margin-bottom:6px;">
    <div class="swatch main dark" style="background:var(--primary-900)"><span>900</span></div>
    <div class="swatch main dark" style="background:var(--primary-800)"><span>800</span></div>
    <div class="swatch main dark" style="background:var(--primary-700)"><span>700</span></div>
    <div class="swatch main dark" style="background:var(--primary-600)"><span>600</span></div>
    <div class="swatch main dark" style="background:var(--primary-500)"><span>500</span></div>
  </div>
  <div class="row">
    <div class="swatch sm light" style="background:var(--primary-400)"><span>400</span></div>
    <div class="swatch sm light" style="background:var(--primary-300)"><span>300</span></div>
    <div class="swatch sm light" style="background:var(--primary-200)"><span>200</span></div>
    <div class="swatch sm light" style="background:var(--primary-100)"><span>100</span></div>
    <div class="swatch sm light" style="background:var(--primary-50);border:1px solid var(--neutral-100)"><span>50</span></div>
  </div>
</body>
</html>
