<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: #fff; padding: 24px 28px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--neutral-400); white-space: nowrap; min-width: 170px; }
  .specimen { color: var(--neutral-800); }
  .blg { font-size: 18px; line-height: 1.55; }
  .bmd { font-size: 16px; line-height: 1.5; }
  .bsm { font-size: 14px; line-height: 1.5; color: var(--neutral-600); }
  .bxs { font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--neutral-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="label">body-lg · 18px · 400</div>
    <div class="specimen blg">We found someone heading your way.</div>
  </div>
  <div class="row">
    <div class="label">body-md · 16px · 400</div>
    <div class="specimen bmd">Your co-rider is 3 minutes away from Terminal 1.</div>
  </div>
  <div class="row">
    <div class="label">body-sm · 14px · 400</div>
    <div class="specimen bsm">Arriving on AZ 1280 from London Heathrow at 14:35.</div>
  </div>
  <div class="row">
    <div class="label">body-xs · 12px · 500</div>
    <div class="specimen bxs">Last updated 2 min ago · MXP Terminal 1</div>
  </div>
</body>
</html>
