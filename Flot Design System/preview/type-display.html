<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-display); background: #fff; padding: 24px 28px; }
  .specimen { color: var(--neutral-900); margin-bottom: 6px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--neutral-400); margin-bottom: 2px; }
  .xl { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
  .lg { font-size: 28px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.25; }
  .md { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .sm { font-size: 20px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.35; }
</style>
</head>
<body>
  <div class="label">display-xl · Sora 700 · 32px</div>
  <div class="specimen xl">Split the ride. Share the savings.</div>
  <div class="label" style="margin-top:12px">display-lg · Sora 700 · 28px</div>
  <div class="specimen lg">Find your match</div>
  <div class="label" style="margin-top:10px">display-md · Sora 600 · 24px</div>
  <div class="specimen md">Your trip details</div>
  <div class="label" style="margin-top:8px">display-sm · Sora 600 · 20px</div>
  <div class="specimen sm">Milan Malpensa → Duomo</div>
</body>
</html>
