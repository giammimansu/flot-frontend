<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--neutral-50); padding: 24px 28px; display: flex; gap: 16px; align-items: center; }
  .card {
    flex: 1; height: 72px; background: #fff; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .name { font-size: 11px; font-weight: 600; color: var(--neutral-700); }
  .val { font-size: 9px; font-family: var(--font-mono); color: var(--neutral-400); line-height: 1.3; text-align: center; }
</style>
</head>
<body>
  <div class="card" style="box-shadow: 0 1px 3px rgba(10,22,36,0.06);">
    <div class="name">Level 1</div>
    <div class="val">0 1px 3px<br>6% opacity</div>
  </div>
  <div class="card" style="box-shadow: 0 2px 8px rgba(10,22,36,0.08);">
    <div class="name">Level 2</div>
    <div class="val">0 2px 8px<br>8% opacity</div>
  </div>
  <div class="card" style="box-shadow: 0 8px 24px rgba(10,22,36,0.12);">
    <div class="name">Level 3</div>
    <div class="val">0 8px 24px<br>12% opacity</div>
  </div>
  <div class="card" style="box-shadow: 0 16px 48px rgba(10,22,36,0.16);">
    <div class="name">Level 4</div>
    <div class="val">0 16px 48px<br>16% opacity</div>
  </div>
</body>
</html>
