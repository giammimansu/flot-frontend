<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@latest/font/lucide.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--neutral-50); padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }

  /* Top nav / header */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--primary-500); color: #fff;
    padding: 12px 18px; border-radius: 12px 12px 0 0;
  }
  .topbar-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
  .topbar-icons { display: flex; gap: 16px; }
  .topbar-icons i { font-size: 20px; }

  /* Bottom nav */
  .bottombar {
    display: flex; align-items: center; justify-content: space-around;
    background: #fff; border-radius: 0 0 12px 12px;
    padding: 8px 0 10px; box-shadow: 0 -1px 3px rgba(10,22,36,0.06);
    border-top: 1px solid var(--neutral-100);
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
  .tab i { font-size: 22px; color: var(--neutral-400); }
  .tab span { font-size: 10px; font-weight: 600; color: var(--neutral-400); }
  .tab.active i { color: var(--primary-500); }
  .tab.active span { color: var(--primary-500); }
  .tab .notif { position: relative; }
  .tab .notif::after {
    content: ''; position: absolute; top: -2px; right: -6px;
    width: 7px; height: 7px; background: var(--accent-500); border-radius: 50%;
    border: 1.5px solid #fff;
  }

  /* Custom brand icon: "I miei viaggi" route glyph */
  .trip-icon { width: 22px; height: 22px; display: block; color: var(--neutral-400); }
  .tab.active .trip-icon { color: var(--primary-500); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-title">flot</div>
    <div class="topbar-icons">
      <i class="icon-bell"></i>
      <i class="icon-settings"></i>
    </div>
  </div>
  <div class="bottombar">
    <div class="tab">
      <i class="icon-house"></i>
      <span>Home</span>
    </div>
    <div class="tab active">
      <svg class="trip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 7 17 17"/>
        <circle cx="7" cy="7" r="3" fill="currentColor" stroke="none"/>
        <circle cx="17" cy="17" r="3" fill="var(--accent-500)" stroke="none"/>
      </svg>
      <span>I miei viaggi</span>
    </div>
    <div class="tab">
      <i class="icon-message-circle notif"></i>
      <span>Chat</span>
    </div>
    <div class="tab">
      <i class="icon-user"></i>
      <span>Profile</span>
    </div>
  </div>
</body>
</html>
