<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: #fff; padding: 20px 24px; display: flex; gap: 10px; }
  .group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .group-label { font-size: 10px; font-weight: 600; color: var(--neutral-500); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  .swatch-row { display: flex; gap: 4px; align-items: center; }
  .dot { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; }
  .meta { display: flex; flex-direction: column; }
  .meta .name { font-size: 11px; font-weight: 600; color: var(--neutral-800); }
  .meta .hex { font-size: 10px; font-family: var(--font-mono); color: var(--neutral-400); }
</style>
</head>
<body>
  <div class="group">
    <div class="group-label">Success</div>
    <div class="swatch-row"><div class="dot" style="background:#22A352"></div><div class="meta"><span class="name">500</span><span class="hex">#22A352</span></div></div>
    <div class="swatch-row"><div class="dot" style="background:#EAFBF0"></div><div class="meta"><span class="name">50</span><span class="hex">#EAFBF0</span></div></div>
  </div>
  <div class="group">
    <div class="group-label">Warning</div>
    <div class="swatch-row"><div class="dot" style="background:#E5A000"></div><div class="meta"><span class="name">500</span><span class="hex">#E5A000</span></div></div>
    <div class="swatch-row"><div class="dot" style="background:#FFF8E6"></div><div class="meta"><span class="name">50</span><span class="hex">#FFF8E6</span></div></div>
  </div>
  <div class="group">
    <div class="group-label">Error</div>
    <div class="swatch-row"><div class="dot" style="background:#D93036"></div><div class="meta"><span class="name">500</span><span class="hex">#D93036</span></div></div>
    <div class="swatch-row"><div class="dot" style="background:#FDF0F0"></div><div class="meta"><span class="name">50</span><span class="hex">#FDF0F0</span></div></div>
  </div>
  <div class="group">
    <div class="group-label">Info</div>
    <div class="swatch-row"><div class="dot" style="background:#0B8A7B"></div><div class="meta"><span class="name">500</span><span class="hex">#0B8A7B</span></div></div>
    <div class="swatch-row"><div class="dot" style="background:#EBF5F4"></div><div class="meta"><span class="name">50</span><span class="hex">#EBF5F4</span></div></div>
  </div>
</body>
</html>
