<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@latest/font/lucide.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--neutral-50); padding: 20px 24px; display: flex; gap: 14px; }
  .card {
    flex: 1; background: #fff; border-radius: 12px; padding: 16px;
    box-shadow: 0 2px 8px rgba(10,22,36,0.08); border: 1px solid var(--neutral-100);
    display: flex; flex-direction: column; gap: 10px;
  }
  .card-header { display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--neutral-900); }
  .route { display: flex; align-items: center; gap: 8px; }
  .route-dot { width: 8px; height: 8px; border-radius: 50%; }
  .route-line { flex: 1; height: 2px; background: var(--neutral-200); border-radius: 1px; }
  .route-label { font-size: 12px; color: var(--neutral-600); }
  .meta { display: flex; gap: 12px; font-size: 12px; color: var(--neutral-500); }
  .meta i { font-size: 14px; vertical-align: -2px; margin-right: 3px; }
  .price { font-family: var(--font-mono); font-size: 20px; font-weight: 600; color: var(--primary-600); }
  .price-original { font-family: var(--font-mono); font-size: 13px; color: var(--neutral-400); text-decoration: line-through; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-success { background: var(--success-50); color: var(--success-700); }
  .badge-warning { background: var(--warning-50); color: var(--warning-700); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-100); color: var(--primary-700); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .match-row { display: flex; align-items: center; gap: 10px; }
  .match-info { font-size: 13px; color: var(--neutral-700); }
  .match-sub { font-size: 11px; color: var(--neutral-400); }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="card-title">MXP → Duomo</div>
      <span class="badge badge-success">Matched</span>
    </div>
    <div class="route">
      <div class="route-dot" style="background:var(--primary-500)"></div>
      <div class="route-label">T1</div>
      <div class="route-line"></div>
      <div class="route-label">Duomo</div>
      <div class="route-dot" style="background:var(--accent-500)"></div>
    </div>
    <div class="meta">
      <span><i class="icon-clock"></i>14:35</span>
      <span><i class="icon-briefcase"></i>1 bag</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:8px">
      <span class="price">€60</span>
      <span class="price-original">€120</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">Your match</div>
      <span class="badge badge-warning">Pending</span>
    </div>
    <div class="match-row">
      <div class="avatar">SL</div>
      <div>
        <div class="match-info">Sofia L.</div>
        <div class="match-sub">4.9 ★ · 12 rides</div>
      </div>
    </div>
    <div class="meta">
      <span><i class="icon-plane"></i>AZ 1280</span>
      <span><i class="icon-clock"></i>14:20</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:auto">
      <button style="flex:1;height:36px;background:var(--primary-500);color:#fff;border:none;border-radius:8px;font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer">Unlock · €1.99</button>
    </div>
  </div>
</body>
</html>
